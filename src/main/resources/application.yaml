spring:
  application:
    name: demo

  datasource:
    url: jdbc:mariadb://localhost:3306/verkkis
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    # Skeema on olemassa (MariaDB-dump), Hibernate ei luo eikä muuta tauluja
    hibernate:
      ddl-auto: none
    # Lazy-latauksia ei tehdä HTTP-vastauksen aikana: palvelut palauttavat valmiit DTO:t
    open-in-view: false
    properties:
      hibernate:
        show_sql: true
        format_sql: true

  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8081
