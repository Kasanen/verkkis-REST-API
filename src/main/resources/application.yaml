spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        ddl-auto: validate
  
  application:
    name: demo

  datasource:
    url: jdbc:mariadb://localhost:3306/verkkis
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

server:
  port: 8081